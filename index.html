<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Lunarelle 3D Body Avatar</title>
  <style>
    :root{
      --bg:#070813;
      --panel:rgba(13,16,30,.78);
      --panel2:rgba(255,255,255,.075);
      --line:rgba(255,255,255,.14);
      --text:#f6f2ff;
      --muted:#aaa4c6;
      --violet:#8a6fd1;
      --lav:#c7b6e6;
      --gold:#d8c49a;
      --cyan:#88eaff;
      --pink:#ff8ad8;
      --ok:#8dffb4;
      --bad:#ff647d;
      --shadow:0 18px 48px rgba(0,0,0,.46);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 30% 12%,#1e2756 0,#080914 48%,#03040a 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:manipulation}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;min-height:54px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:38px;height:38px;border-radius:14px;background:conic-gradient(from 30deg,#d8c49a,#8a6fd1,#1e2756,#c7b6e6,#d8c49a);box-shadow:0 0 22px rgba(199,182,230,.32);position:relative}.mark:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.65)}
    h1{margin:0;font-size:16px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);white-space:nowrap}.status{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}.status strong{color:#fff;font-weight:700}
    .stage{position:relative;min-height:0;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:#03040a;box-shadow:var(--shadow)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hiddenVideo{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    .badge{position:absolute;left:12px;top:12px;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(3,4,10,.62);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:12px;color:#eee9ff}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px currentColor}.dot.on{background:var(--ok)}.meter{width:96px;height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}.meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold));transition:width .12s linear}
    .help{position:absolute;right:12px;top:12px;z-index:10;max-width:58%;padding:8px 10px;border-radius:999px;background:rgba(3,4,10,.62);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:12px;color:#eee9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;max-width:min(740px,calc(100% - 24px));padding:12px 14px;border-radius:16px;background:rgba(3,4,10,.86);border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow);font-size:13px;color:#fff}.toast.show{display:block}
    .sheetPanel{position:absolute;right:12px;bottom:14px;z-index:11;width:min(420px,calc(100% - 24px));display:none;grid-template-columns:86px 1fr 70px;gap:10px;align-items:center;padding:10px;border-radius:18px;background:rgba(7,8,19,.82);border:1px solid rgba(255,255,255,.14);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.sheetPanel.show{display:grid}.sheetPanel img{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#f7f2ea}.sheetPanel .copy{font-size:12px;line-height:1.55;color:#ddd7f5}.sheetPanel .copy b{font-size:13px;color:#fff}.sheetPanel .copy span{color:var(--muted)}
    .controls{display:grid;grid-template-columns:1fr;gap:8px;padding-bottom:10px}.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}button,select,label.toggle{appearance:none;border:1px solid rgba(255,255,255,.15);background:var(--panel);color:var(--text);border-radius:15px;padding:11px 13px;font-size:14px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(14px)}button{font-weight:700;cursor:pointer}button.primary{border-color:rgba(199,182,230,.54);background:linear-gradient(135deg,rgba(138,111,209,.35),rgba(216,196,154,.16))}button.active{border-color:rgba(216,196,154,.56);background:linear-gradient(135deg,rgba(138,111,209,.35),rgba(255,138,216,.15))}button:disabled{opacity:.55;cursor:not-allowed}button:active{transform:translateY(1px)}select{padding-right:28px}label.toggle{display:flex;gap:8px;align-items:center}.toggle input{accent-color:#8a6fd1}
    @media (min-width:900px){.app{padding-left:18px;padding-right:18px}.controls{grid-template-columns:auto auto;justify-content:space-between;align-items:center}.row:first-child{justify-content:flex-start}.row:last-child{justify-content:flex-end}h1{font-size:18px}.stage{border-radius:30px}.sheetPanel{width:450px;grid-template-columns:96px 1fr 78px}}
  </style>
</head>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const $ = (id)=>document.getElementById(id);
const video = $('video');
const stage = $('stage');
const videoCanvas = $('videoLayer');
const glCanvas = $('webglLayer');

let PoseLandmarker, FilesetResolver, poseLandmarker;
let renderer, scene, camera, avatar;
let started = false;
let mode = 'avatar';
let lastVideoTime = -1;
let lastResult = null;
let smoothed = null;
let rafId = 0;
let fps = 0;
let lastFrameTs = performance.now();
let lastNoPoseToast = 0;
let currentStyle = 'lunarelle';
let activeViewport = {x:0,y:0,w:1,h:1,aspect:1};
let viewHeight = 6;
let viewWidth = 6;

const CONNECTORS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
const KEYPOINTS = [0,11,12,13,14,15,16,23,24,25,26,27,28,31,32];

const STYLES = {
  lunarelle:{
    name:'ルナレル', skin:0xf4e9ee, hair:0x8a6fd1, hair2:0xc7b6e6, outfit:0x1e2756, outfit2:0x4b3d9a, cloth:0xc7b6e6, accent:0xd8c49a, glow:0xb4c7e7, eye:0x7c55e7, metal:0xd8c49a, cute:false, fantasy:true
  },
  cool:{
    name:'カッコイイ', skin:0xe9e3ef, hair:0x141722, hair2:0x83eaff, outfit:0x090d1c, outfit2:0x172743, cloth:0x1b233f, accent:0x78f0ff, glow:0xff7ad9, eye:0x78f0ff, metal:0x7b8cff, cute:false, fantasy:false
  },
  cute:{
    name:'可愛い', skin:0xffedf4, hair:0xff8ad8, hair2:0xffc6ec, outfit:0xff9ed7, outfit2:0x9ee9ff, cloth:0xffd8ef, accent:0xffffff, glow:0x8af1ff, eye:0x5a4f82, metal:0xffffff, cute:true, fantasy:false
  }
};

function showToast(message){
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.remove('show'), 3600);
}

function setMode(next){
  mode = next;
  avatarModeBtn.classList.toggle('active', mode === 'avatar');
  testModeBtn.classList.toggle('active', mode === 'test');
  modeText.textContent = mode === 'avatar' ? 'アバターモード' : 'テストモード';
  helpText.textContent = mode === 'avatar'
    ? '3Dアバターを実映像に重ねる。全身が入るほど安定します'
    : '左が実映像、右が3Dアバター。関節対応を線で表示します';
}

avatarModeBtn.onclick = ()=>setMode('avatar');
testModeBtn.onclick = ()=>setMode('test');
sheetToggle.onchange = ()=>sheetPanel.classList.toggle('show', sheetToggle.checked);
sheetPanel.classList.toggle('show', sheetToggle.checked);
characterSelect.onchange = ()=>{
  currentStyle = characterSelect.value;
  rebuildAvatar();
};

function fitCanvases(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const w = Math.max(2, Math.round(r.width * dpr));
  const h = Math.max(2, Math.round(r.height * dpr));
  for(const c of [videoCanvas, glCanvas, linkCanvas]){
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  }
  if(renderer){ renderer.setSize(w, h, false); renderer.setPixelRatio(1); }
}
window.addEventListener('resize', fitCanvases);

async function loadMediaPipe(){
  if(PoseLandmarker && FilesetResolver) return;
  subStatus.textContent = '姿勢推定を読み込み中';
  const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs');
  PoseLandmarker = mod.PoseLandmarker;
  FilesetResolver = mod.FilesetResolver;
}

async function createPoseLandmarker(){
  if(poseLandmarker) return;
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU'
    },
    runningMode:'VIDEO',
    numPoses:1,
    minPoseDetectionConfidence:.55,
    minPosePresenceConfidence:.55,
    minTrackingConfidence:.55,
    outputSegmentationMasks:false
  });
}

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error('カメラが使えません。GitHub PagesなどHTTPS環境で開いてください。');
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,max:60}}
  });
  video.srcObject = stream;
  await video.play();
}

function initThree(){
  if(renderer) return;
  renderer = new THREE.WebGLRenderer({canvas:glCanvas, alpha:true, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(1);
  renderer.setSize(glCanvas.width, glCanvas.height, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-3,3,3,-3,.1,100);
  camera.position.set(0,0,10);
  camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff,.76));
  const key = new THREE.DirectionalLight(0xffffff,1.12);
  key.position.set(2,3,5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xb4c7e7,.7);
  rim.position.set(-2,1,3); scene.add(rim);
  rebuildAvatar();
}

startBtn.onclick = async ()=>{
  if(started) return;
  startBtn.disabled = true;
  try{
    showToast('カメラ許可が出たら許可。全身が入る位置まで少し下がると安定します。');
    fitCanvases();
    initThree();
    await loadMediaPipe();
    await createPoseLandmarker();
    await startCamera();
    started = true;
    liveDot.classList.add('on');
    liveText.textContent = 'camera on';
    subStatus.textContent = '起動中';
    startBtn.textContent = '起動済み';
    renderLoop();
  }catch(err){
    console.error(err);
    startBtn.disabled = false;
    startBtn.textContent = '再試行';
    liveText.textContent = 'camera error';
    subStatus.textContent = '起動失敗';
    showToast(err?.message || '起動に失敗しました');
  }
};

function mat(color, opts={}){
  return new THREE.MeshStandardMaterial({
    color, metalness:opts.metalness ?? .08, roughness:opts.roughness ?? .46,
    transparent:opts.opacity !== undefined && opts.opacity < 1, opacity:opts.opacity ?? 1,
    emissive:opts.emissive ?? 0x000000, emissiveIntensity:opts.emissiveIntensity ?? 0,
    side:opts.side ?? THREE.FrontSide, depthWrite:opts.depthWrite ?? true
  });
}
function basicMat(color, opts={}){
  return new THREE.MeshBasicMaterial({color, transparent:opts.opacity !== undefined && opts.opacity < 1, opacity:opts.opacity ?? 1, side:opts.side ?? THREE.FrontSide, depthWrite:opts.depthWrite ?? true});
}
function addMesh(group, name, geom, material){ const m = new THREE.Mesh(geom, material); m.name = name; group.add(m); return m; }
function addSphere(group, name, r, material, scale=[1,1,1]){ const m = addMesh(group,name,new THREE.SphereGeometry(r,24,16),material); m.scale.set(...scale); return m; }
function addCylinder(group, name, material, radial=18){ return addMesh(group,name,new THREE.CylinderGeometry(1,1,1,radial,1,true),material); }

function disposeGroup(g){
  if(!g) return;
  g.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material){ const arr = Array.isArray(o.material) ? o.material : [o.material]; arr.forEach(m=>m.dispose?.()); }
  });
  scene.remove(g);
}

function rebuildAvatar(){
  if(!scene) return;
  disposeGroup(avatar?.root);
  avatar = createProceduralAvatar(STYLES[currentStyle]);
  scene.add(avatar.root);
}

function createProceduralAvatar(style){
  const root = new THREE.Group();
  const m = {
    skin:mat(style.skin,{roughness:.55}),
    hair:mat(style.hair,{roughness:.5}), hair2:mat(style.hair2,{roughness:.45}),
    outfit:mat(style.outfit,{metalness:.12,roughness:.42}), outfit2:mat(style.outfit2,{metalness:.16,roughness:.35}),
    cloth:mat(style.cloth,{opacity:style.fantasy?.52:.72,side:THREE.DoubleSide,depthWrite:false,roughness:.32}),
    accent:mat(style.accent,{metalness:.55,roughness:.25,emissive:style.accent,emissiveIntensity:style.fantasy?.05:.02}),
    glow:mat(style.glow,{emissive:style.glow,emissiveIntensity:.55,opacity:.82,depthWrite:false}),
    eye:basicMat(style.eye),
    white:mat(0xf4f4fa,{roughness:.4}),
    dark:mat(style.outfit,{roughness:.46})
  };
  const parts = {};
  const limbs = ['lUpperArm','lLowerArm','rUpperArm','rLowerArm','lThigh','lShin','rThigh','rShin'];
  limbs.forEach(n=>parts[n] = addCylinder(root,n,m.skin));
  ['lGlove','rGlove','lBoot','rBoot'].forEach(n=>parts[n] = addCylinder(root,n, n.includes('Boot')?m.outfit2:m.accent));
  parts.torso = addCylinder(root,'torso',m.outfit,28);
  parts.chest = addSphere(root,'chest',1,m.outfit2,[.75,.45,.32]);
  parts.hip = addSphere(root,'hip',1,m.outfit,[.65,.30,.26]);
  parts.neck = addCylinder(root,'neck',m.skin,18);
  parts.headGroup = new THREE.Group(); root.add(parts.headGroup);
  parts.head = addSphere(parts.headGroup,'head',1,m.skin,[.88,1.03,.78]);
  parts.facePlate = addSphere(parts.headGroup,'facePlate',.92,mat(0xfff5f8,{roughness:.52}),[.78,.86,.08]); parts.facePlate.position.z = .63;
  parts.leftEye = addSphere(parts.headGroup,'leftEye',.055,m.eye,[1.25,1,.22]); parts.leftEye.position.set(-.23,.08,.72);
  parts.rightEye = addSphere(parts.headGroup,'rightEye',.055,m.eye,[1.25,1,.22]); parts.rightEye.position.set(.23,.08,.72);
  parts.mouth = addMesh(parts.headGroup,'mouth',new THREE.TorusGeometry(.09,.012,8,24,Math.PI),basicMat(0xa44a68)); parts.mouth.position.set(0,-.22,.73); parts.mouth.rotation.z = Math.PI;
  parts.hairBack = addSphere(parts.headGroup,'hairBack',1,m.hair,[1.02,1.20,.56]); parts.hairBack.position.set(0,.08,-.20);
  parts.hairSideL = addSphere(parts.headGroup,'hairSideL',.44,m.hair2,[.42,1.16,.28]); parts.hairSideL.position.set(-.67,-.28,.05);
  parts.hairSideR = addSphere(parts.headGroup,'hairSideR',.44,m.hair2,[.42,1.16,.28]); parts.hairSideR.position.set(.67,-.28,.05);
  parts.hairTail = addCylinder(parts.headGroup,'hairTail',m.hair2,16); parts.hairTail.position.set(0,-1.08,-.25);
  parts.halo = addMesh(parts.headGroup,'halo',new THREE.TorusGeometry(.72,.025,8,64),m.accent); parts.halo.position.set(0,.34,-.08); parts.halo.rotation.x = .10;
  parts.star = addMesh(parts.headGroup,'star',new THREE.OctahedronGeometry(.12),m.glow); parts.star.position.set(0,.95,.15);
  parts.lEarring = addMesh(parts.headGroup,'lEarring',new THREE.OctahedronGeometry(.06),m.accent); parts.lEarring.position.set(-.70,-.18,.24);
  parts.rEarring = addMesh(parts.headGroup,'rEarring',new THREE.OctahedronGeometry(.06),m.accent); parts.rEarring.position.set(.70,-.18,.24);
  parts.frontSkirt = addMesh(root,'frontSkirt',new THREE.PlaneGeometry(1,1),m.cloth);
  parts.backCape = addMesh(root,'backCape',new THREE.PlaneGeometry(1,1),m.cloth);
  parts.charm = addMesh(root,'charm',new THREE.OctahedronGeometry(1),m.glow);
  parts.belt = addMesh(root,'belt',new THREE.TorusGeometry(1,.035,8,64),m.accent);
  if(style.cute){
    parts.leftEar = addSphere(parts.headGroup,'leftEar',.23,m.hair2,[1.0,1.15,.35]); parts.leftEar.position.set(-.62,.70,.02);
    parts.rightEar = addSphere(parts.headGroup,'rightEar',.23,m.hair2,[1.0,1.15,.35]); parts.rightEar.position.set(.62,.70,.02);
    parts.halo.visible = false; parts.star.visible = false; parts.lEarring.visible = false; parts.rEarring.visible = false;
  }
  return {root, parts, style};
}

const UP = new THREE.Vector3(0,1,0);
function setSegment(mesh, a, b, radius, visible=true){
  if(!mesh) return;
  if(!a || !b || !visible || Math.min(a.v ?? 1, b.v ?? 1) < .20){ mesh.visible = false; return; }
  const start = new THREE.Vector3(a.x,a.y,a.z || 0);
  const end = new THREE.Vector3(b.x,b.y,b.z || 0);
  const mid = start.clone().add(end).multiplyScalar(.5);
  const dir = end.clone().sub(start);
  const len = dir.length();
  if(!isFinite(len) || len < .01){ mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.scale.set(radius, len, radius);
}
function setSphere(mesh, p, size, visible=true){
  if(!mesh) return;
  if(!p || !visible || (p.v ?? 1) < .20){ mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.set(p.x, p.y, p.z || 0);
  mesh.scale.setScalar(size);
}
function setPanel(mesh, center, w, h, z, rotZ=0, visible=true){
  if(!mesh) return;
  if(!center || !visible){ mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.set(center.x, center.y, z);
  mesh.rotation.set(0,0,rotZ);
  mesh.scale.set(w,h,1);
}
function screenToWorld(p, viewport=activeViewport){
  // MediaPipe x/y are normalized image coordinates after mirroring.
  return {
    x:(p.x - .5) * viewWidth,
    y:(.5 - p.y) * viewHeight,
    z:-(p.z || 0) * viewWidth * .42,
    v:p.visibility ?? 1
  };
}
function midpoint(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2,v:Math.min(a.v??1,b.v??1)}; }
function len(a,b){ return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z); }
function angle2(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }

function updateAvatar(lm){
  if(!avatar || !lm){ if(avatar?.root) avatar.root.visible = false; return; }
  avatar.root.visible = true;
  const p = {};
  for(const i of KEYPOINTS){ p[i] = screenToWorld(lm[i]); }
  p.neck = midpoint(p[11], p[12]);
  p.hips = midpoint(p[23], p[24]);
  p.chest = midpoint(p.neck, p.hips);
  const shoulderW = len(p[11], p[12]);
  const hipW = len(p[23], p[24]);
  const torsoH = Math.max(.12, len(p.neck, p.hips));
  const base = Math.max(.035, Math.min(.22, shoulderW * .12));
  const parts = avatar.parts;
  setSegment(parts.lUpperArm,p[11],p[13],base*.95);
  setSegment(parts.lLowerArm,p[13],p[15],base*.78);
  setSegment(parts.rUpperArm,p[12],p[14],base*.95);
  setSegment(parts.rLowerArm,p[14],p[16],base*.78);
  setSegment(parts.lThigh,p[23],p[25],base*1.05);
  setSegment(parts.lShin,p[25],p[27],base*.84);
  setSegment(parts.rThigh,p[24],p[26],base*1.05);
  setSegment(parts.rShin,p[26],p[28],base*.84);
  setSegment(parts.lGlove,p[15],{x:p[15].x,y:p[15].y-base*1.5,z:p[15].z,v:p[15].v},base*.92);
  setSegment(parts.rGlove,p[16],{x:p[16].x,y:p[16].y-base*1.5,z:p[16].z,v:p[16].v},base*.92);
  setSegment(parts.lBoot,p[27],{x:p[27].x,y:p[27].y-base*1.7,z:p[27].z,v:p[27].v},base*1.05);
  setSegment(parts.rBoot,p[28],{x:p[28].x,y:p[28].y-base*1.7,z:p[28].z,v:p[28].v},base*1.05);
  setSegment(parts.neck,p.neck,{x:p.neck.x,y:p.neck.y+base*.75,z:p.neck.z,v:p.neck.v},base*.55);
  setSegment(parts.torso,p.neck,p.hips,Math.max(base*2.1, shoulderW*.25));
  setSphere(parts.chest,p.chest,Math.max(base*2.4,shoulderW*.34));
  setSphere(parts.hip,p.hips,Math.max(base*2.1,hipW*.33));
  const headSize = Math.max(base*3.0, shoulderW*.32);
  const headPos = {x:p[0].x, y:p[0].y + headSize*.10, z:p[0].z+.06, v:p[0].v};
  setSphere(parts.headGroup, headPos, headSize);
  parts.headGroup.rotation.y = THREE.MathUtils.clamp((p[12].z - p[11].z) * 1.3, -.45, .45);
  parts.headGroup.rotation.z = THREE.MathUtils.clamp((p[12].y - p[11].y) * .28, -.18, .18);
  setSegment(parts.hairTail,{x:0,y:-.55,z:-.18,v:1},{x:0,y:-1.85,z:-.28,v:1},.20, true);
  const skirtCenter = {x:p.hips.x,y:p.hips.y - torsoH*.55,z:p.hips.z+.06,v:p.hips.v};
  setPanel(parts.frontSkirt,skirtCenter,Math.max(.45,hipW*1.35),Math.max(.55,torsoH*.95),p.hips.z+.09,angle2(p[23],p[24])*.05);
  const capeCenter = {x:p.hips.x,y:p.hips.y - torsoH*.58,z:p.hips.z-.18,v:p.hips.v};
  setPanel(parts.backCape,capeCenter,Math.max(.58,shoulderW*1.55),Math.max(.80,torsoH*1.25),p.hips.z-.28,0);
  setSphere(parts.charm,{x:p.chest.x,y:p.chest.y+base*.20,z:p.chest.z+.22,v:p.chest.v},base*.92);
  parts.belt.visible = p.hips.v > .2;
  if(parts.belt.visible){ parts.belt.position.set(p.hips.x,p.hips.y+.08,p.hips.z+.18); parts.belt.scale.set(Math.max(.2,hipW*.52),Math.max(.08,base*.35),Math.max(.2,hipW*.52)); parts.belt.rotation.set(Math.PI/2,0,0); }
}

function mirrorLandmarks(landmarks){ return landmarks.map(p=>({...p, x:1-p.x})); }
function smoothLandmarks(next){
  if(!next) return smoothed;
  const mirrored = mirrorLandmarks(next);
  if(!smoothed){ smoothed = mirrored.map(p=>({...p})); return smoothed; }
  const alpha = .36;
  for(let i=0;i<mirrored.length;i++){
    const n = mirrored[i], s = smoothed[i] || n;
    if((n.visibility ?? 1) > .25){
      s.x += (n.x-s.x)*alpha; s.y += (n.y-s.y)*alpha; s.z = (s.z || 0) + ((n.z || 0)-(s.z || 0))*alpha; s.visibility = n.visibility ?? 1;
    }else{ s.visibility = (s.visibility || 0)*.92; }
    smoothed[i] = s;
  }
  return smoothed;
}
function trackingScore(lm){ if(!lm) return 0; return KEYPOINTS.reduce((a,i)=>a+(lm[i]?.visibility??0),0)/KEYPOINTS.length; }

function rectContain(srcAspect,dst){
  const a = dst.w/dst.h; let w,h,x,y;
  if(srcAspect>a){ w=dst.w; h=w/srcAspect; x=dst.x; y=dst.y+(dst.h-h)/2; }
  else{ h=dst.h; w=h*srcAspect; x=dst.x+(dst.w-w)/2; y=dst.y; }
  return {x,y,w,h};
}
function rectCover(srcAspect,dst){
  const a = dst.w/dst.h; let w,h,x,y;
  if(srcAspect>a){ h=dst.h; w=h*srcAspect; x=dst.x+(dst.w-w)/2; y=dst.y; }
  else{ w=dst.w; h=w/srcAspect; x=dst.x; y=dst.y+(dst.h-h)/2; }
  return {x,y,w,h};
}
function drawMirroredVideo(dst, fit='cover', alpha=1){
  if(!video.videoWidth) return;
  const srcAspect = video.videoWidth/video.videoHeight;
  const r = fit==='contain' ? rectContain(srcAspect,dst) : rectCover(srcAspect,dst);
  vctx.save(); vctx.globalAlpha = alpha; vctx.translate(r.x+r.w,r.y); vctx.scale(-1,1); vctx.drawImage(video,0,0,r.w,r.h); vctx.restore();
}
function drawFantasyBackground(ctx,w,h){
  const grad = ctx.createRadialGradient(w*.48,h*.18,10,w*.5,h*.48,Math.max(w,h)*.72);
  grad.addColorStop(0,'#1e2756'); grad.addColorStop(.55,'#090b1a'); grad.addColorStop(1,'#03040a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.globalAlpha=.18; ctx.strokeStyle='rgba(216,196,154,.25)'; ctx.lineWidth=1;
  const step = Math.max(36, Math.round(Math.min(w,h)/13));
  for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();
  ctx.save(); ctx.globalAlpha=.6; ctx.fillStyle='rgba(216,196,154,.55)';
  for(let i=0;i<38;i++){ const x=(i*97)%w, y=(i*211)%h, r=1+((i*17)%3); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawPanel(ctx,r,title){
  ctx.save(); ctx.fillStyle='rgba(255,255,255,.045)'; ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,24); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.stroke();
  ctx.font=`${Math.max(14, Math.round(videoCanvas.height*.022))}px system-ui`; ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fillText(title,r.x+16,r.y+30); ctx.restore();
}
function project2D(p,dst,pad=0){ return {x:dst.x+pad+p.x*(dst.w-pad*2), y:dst.y+pad+p.y*(dst.h-pad*2), v:p.visibility??1}; }
function drawSkeleton(ctx,lm,dst,opt={}){
  if(!lm) return;
  const pad = opt.pad || 0;
  const pts = lm.map(p=>project2D(p,dst,pad));
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for(const [a,b] of CONNECTORS){ if((pts[a].v??1)<.25 || (pts[b].v??1)<.25) continue; ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y); ctx.lineWidth=opt.lineWidth||4; ctx.strokeStyle=opt.stroke||'rgba(180,199,231,.75)'; ctx.stroke(); }
  for(const i of KEYPOINTS){ const p=pts[i]; if(!p || p.v<.25) continue; ctx.beginPath(); ctx.arc(p.x,p.y,opt.radius||5,0,Math.PI*2); ctx.fillStyle=opt.fill||'rgba(255,255,255,.94)'; ctx.fill(); }
  ctx.restore();
}
function drawLinks(ctx,lm,left,right){
  if(!lm) return;
  const padL = Math.min(left.w,left.h)*.02;
  const padR = Math.min(right.w,right.h)*.02;
  const aPts = lm.map(p=>project2D(p,left,padL));
  const bPts = lm.map(p=>project2D(p,right,padR));
  ctx.save(); ctx.setLineDash([7,8]); ctx.lineWidth=Math.max(1.5, linkCanvas.width*.0023);
  for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
    const a=aPts[i], b=bPts[i]; if(!a || !b || a.v<.3 || b.v<.3) continue;
    const c1x = left.x+left.w+(right.x-left.x-left.w)*.34;
    const c2x = left.x+left.w+(right.x-left.x-left.w)*.66;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(c1x,a.y,c2x,b.y,b.x,b.y); ctx.strokeStyle = i%2 ? 'rgba(180,199,231,.42)' : 'rgba(216,196,154,.42)'; ctx.stroke();
  }
  ctx.restore();
}
function drawNoPose(ctx,w,h){
  const now = performance.now();
  if(now-lastNoPoseToast > 2500){ lastNoPoseToast = now; showToast('体が検出できません。肩・腰・膝が画面に入るように下がってください。'); }
  ctx.save(); ctx.fillStyle='rgba(3,4,10,.42)'; ctx.fillRect(0,0,w,h); ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font=`${Math.max(17,Math.round(h*.029))}px system-ui`; ctx.fillText('全身が入る位置に立つと追従します',w/2,h/2); ctx.restore();
}

function setCameraForViewport(vp){
  activeViewport = vp;
  const aspect = Math.max(.1, vp.w/vp.h);
  viewHeight = 6;
  viewWidth = viewHeight * aspect;
  camera.left = -viewWidth/2; camera.right = viewWidth/2; camera.top = viewHeight/2; camera.bottom = -viewHeight/2; camera.updateProjectionMatrix();
}
function clearWebGL(){
  renderer.setScissorTest(false);
  renderer.setViewport(0,0,glCanvas.width,glCanvas.height);
  renderer.clear(true,true,true);
}
function renderAvatarViewport(vp,lm){
  setCameraForViewport(vp);
  updateAvatar(lm);
  renderer.setScissorTest(true);
  renderer.setViewport(vp.x, glCanvas.height - vp.y - vp.h, vp.w, vp.h);
  renderer.setScissor(vp.x, glCanvas.height - vp.y - vp.h, vp.w, vp.h);
  renderer.render(scene,camera);
  renderer.setScissorTest(false);
}
function drawFrame(lm){
  const w = videoCanvas.width, h = videoCanvas.height;
  vctx.clearRect(0,0,w,h); lctx.clearRect(0,0,w,h); clearWebGL();
  if(mode === 'avatar'){
    const full = {x:0,y:0,w,h};
    if(bgToggle.checked) drawMirroredVideo(full,'cover',.92); else drawFantasyBackground(vctx,w,h);
    if(lm){ renderAvatarViewport(full,lm); if(debugToggle.checked) drawSkeleton(lctx,lm,full,{lineWidth:Math.max(2,w*.004),radius:Math.max(4,w*.005)}); }
    else if(started){ drawNoPose(lctx,w,h); updateAvatar(null); }
  }else{
    drawFantasyBackground(vctx,w,h);
    const gap = Math.max(18,w*.025), margin = Math.max(12,w*.018);
    const panelW = (w - margin*2 - gap)/2;
    const panelH = h - margin*2;
    const left = {x:margin,y:margin,w:panelW,h:panelH};
    const right = {x:margin+panelW+gap,y:margin,w:panelW,h:panelH};
    drawPanel(vctx,left,'REAL'); drawPanel(vctx,right,'3D AVATAR');
    vctx.save(); vctx.beginPath(); vctx.roundRect(left.x,left.y,left.w,left.h,24); vctx.clip(); drawMirroredVideo(left,'contain',.95); vctx.restore();
    if(lm){
      drawSkeleton(lctx,lm,left,{lineWidth:Math.max(2,w*.003),radius:Math.max(3,w*.004),pad:Math.min(left.w,left.h)*.02});
      drawLinks(lctx,lm,left,right);
      renderAvatarViewport(right,lm);
      if(debugToggle.checked) drawSkeleton(lctx,lm,right,{lineWidth:Math.max(2,w*.0024),radius:Math.max(3,w*.0035),pad:Math.min(right.w,right.h)*.02,stroke:'rgba(216,196,154,.7)'});
    }else if(started){ drawNoPose(lctx,w,h); updateAvatar(null); }
  }
}

function renderLoop(){
  fitCanvases();
  if(video.readyState >= 2 && poseLandmarker && video.currentTime !== lastVideoTime){
    try{
      lastResult = poseLandmarker.detectForVideo.length >= 2 ? poseLandmarker.detectForVideo(video, performance.now()) : poseLandmarker.detectForVideo(video);
      lastVideoTime = video.currentTime;
    }catch(e){ console.error(e); }
  }
  const raw = lastResult?.landmarks?.[0] || null;
  const lm = raw ? smoothLandmarks(raw) : null;
  const score = trackingScore(lm);
  trackingMeter.style.width = `${Math.round(score*100)}%`;
  subStatus.textContent = score > .55 ? `${STYLES[currentStyle].name}：追従中` : (started ? '検出待ち' : '未起動');
  drawFrame(lm);
  const now = performance.now();
  fps = fps*.88 + (1000/Math.max(1,now-lastFrameTs))*.12;
  lastFrameTs = now;
  fpsEl.textContent = Math.round(fps);
  rafId = requestAnimationFrame(renderLoop);
}

function initialPaint(){
  fitCanvases(); initThree();
  drawFantasyBackground(vctx,videoCanvas.width,videoCanvas.height);
  lctx.save(); lctx.textAlign='center'; lctx.fillStyle='rgba(255,255,255,.92)'; lctx.font=`${Math.max(19,Math.round(videoCanvas.height*.032))}px system-ui`; lctx.fillText('開始を押す',videoCanvas.width/2,videoCanvas.height/2-14); lctx.font=`${Math.max(12,Math.round(videoCanvas.height*.020))}px system-ui`; lctx.fillStyle='rgba(255,255,255,.64)'; lctx.fillText('シート由来の3Dリグが、体の動きに合わせて動きます',videoCanvas.width/2,videoCanvas.height/2+24); lctx.restore();
}
initialPaint();

window.addEventListener('beforeunload',()=>{
  cancelAnimationFrame(rafId);
  const stream = video.srcObject;
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
