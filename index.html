<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Body Link Avatar</title>
  <style>
    :root{
      --bg:#090b10;
      --panel:rgba(16,19,28,.78);
      --panel-2:rgba(255,255,255,.08);
      --text:#f3f6ff;
      --muted:#9aa3b8;
      --line:rgba(255,255,255,.16);
      --accent:#78f0ff;
      --accent2:#ff7ad9;
      --danger:#ff6b7a;
      --ok:#8dffb4;
      --shadow:0 18px 48px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:radial-gradient(circle at 25% 12%, #172335 0, #090b10 46%, #050609 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
    body{touch-action:manipulation}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7b61ff 55%,var(--accent2));box-shadow:0 0 22px rgba(120,240,255,.28)}
    h1{font-size:16px;margin:0;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
    .stageWrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#050609;box-shadow:var(--shadow)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    video{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    .topBadge{position:absolute;left:12px;top:12px;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(5,6,9,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#dce5ff}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 10px currentColor}.dot.on{background:var(--ok)}
    .help{position:absolute;right:12px;top:12px;z-index:4;padding:8px 10px;border-radius:999px;background:rgba(5,6,9,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#dce5ff;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .controls{display:grid;grid-template-columns:1fr;gap:8px;padding:0 0 10px}
    .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
    button,select,label.toggle{appearance:none;border:1px solid rgba(255,255,255,.14);background:var(--panel);color:var(--text);border-radius:15px;padding:11px 13px;font-size:14px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(14px)}
    button{font-weight:700;cursor:pointer}button:active{transform:translateY(1px)}button.primary{border-color:rgba(120,240,255,.42);background:linear-gradient(135deg,rgba(120,240,255,.22),rgba(123,97,255,.18))}button.active{background:linear-gradient(135deg,rgba(120,240,255,.32),rgba(255,122,217,.18));border-color:rgba(120,240,255,.58)}button:disabled{opacity:.5;cursor:not-allowed}
    select{padding-right:30px}.toggle{display:flex;gap:8px;align-items:center}.toggle input{accent-color:#78f0ff}
    .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;max-width:min(720px,calc(100% - 24px));padding:12px 14px;border-radius:16px;background:rgba(5,6,9,.82);border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow);font-size:13px;color:#e8edff;display:none}.toast.show{display:block}
    .meter{width:92px;height:8px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear}
    @media (min-width:800px){.app{padding-left:18px;padding-right:18px}.controls{grid-template-columns:auto auto;justify-content:space-between;align-items:center}.row{justify-content:flex-start}.row:last-child{justify-content:flex-end}h1{font-size:18px}.stageWrap{border-radius:28px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="mark"></div><div><h1>Body Link Avatar</h1><div class="status" id="subStatus">未起動</div></div></div>
      <div class="status"><span id="fps">0</span> fps</div>
    </header>

    <main class="stageWrap" id="stageWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="stage"></canvas>
      <div class="topBadge"><span class="dot" id="liveDot"></span><span id="liveText">camera off</span><div class="meter"><span id="trackingMeter"></span></div></div>
      <div class="help" id="helpText">開始を押して、全身が入る位置に立つ</div>
      <div class="toast" id="toast"></div>
    </main>

    <section class="controls">
      <div class="row">
        <button id="startBtn" class="primary">開始</button>
        <button id="avatarModeBtn" class="active">アバターモード</button>
        <button id="testModeBtn">テストモード</button>
      </div>
      <div class="row">
        <select id="characterSelect" aria-label="キャラ選択">
          <option value="cool">カッコイイキャラ</option>
          <option value="cute">可愛いキャラ</option>
        </select>
        <label class="toggle"><input type="checkbox" id="bgToggle" checked>リアル背景</label>
        <label class="toggle"><input type="checkbox" id="debugToggle">骨格表示</label>
      </div>
    </section>
  </div>

<script type="module">
const $ = (id)=>document.getElementById(id);
const video = $('video');
const canvas = $('stage');
const ctx = canvas.getContext('2d', { alpha:false });
const startBtn = $('startBtn');
const avatarModeBtn = $('avatarModeBtn');
const testModeBtn = $('testModeBtn');
const characterSelect = $('characterSelect');
const bgToggle = $('bgToggle');
const debugToggle = $('debugToggle');
const liveDot = $('liveDot');
const liveText = $('liveText');
const helpText = $('helpText');
const subStatus = $('subStatus');
const fpsEl = $('fps');
const toast = $('toast');
const trackingMeter = $('trackingMeter');

let PoseLandmarker, FilesetResolver;
let poseLandmarker = null;
let started = false;
let mode = 'avatar';
let smoothed = null;
let lastVideoTime = -1;
let lastFrameTs = performance.now();
let fps = 0;
let rafId = null;
let lastResult = null;
let lastToastAt = 0;

const CONNECTORS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[27,31],[24,26],[26,28],[28,32],
  [15,19],[16,20],[27,29],[28,30]
];
const KEYPOINTS = [0,11,12,13,14,15,16,23,24,25,26,27,28,31,32];
const LABELS = {0:'head',11:'L shoulder',12:'R shoulder',13:'L elbow',14:'R elbow',15:'L wrist',16:'R wrist',23:'L hip',24:'R hip',25:'L knee',26:'R knee',27:'L ankle',28:'R ankle'};

function showToast(message){
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(()=>toast.classList.remove('show'), 3800);
}

function setMode(next){
  mode = next;
  avatarModeBtn.classList.toggle('active', mode === 'avatar');
  testModeBtn.classList.toggle('active', mode === 'test');
  helpText.textContent = mode === 'avatar'
    ? 'アバターを実映像に重ねる。腕と脚が画面外に出ると追従が弱くなる'
    : '左が実映像、右がアバター。線で同じ関節の対応を表示';
}
avatarModeBtn.onclick = ()=>setMode('avatar');
testModeBtn.onclick = ()=>setMode('test');

function fitCanvas(){
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const r = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.floor(r.width * dpr));
  const h = Math.max(1, Math.floor(r.height * dpr));
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
  }
}
window.addEventListener('resize', fitCanvas);

async function loadMediaPipe(){
  if(PoseLandmarker && FilesetResolver) return;
  subStatus.textContent = '姿勢推定を読み込み中';
  const candidates = [
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs',
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm'
  ];
  let mod = null;
  let error = null;
  for(const url of candidates){
    try{
      mod = await import(url);
      if(mod.PoseLandmarker && mod.FilesetResolver) break;
    }catch(e){ error = e; }
  }
  if(!mod || !mod.PoseLandmarker || !mod.FilesetResolver){
    throw error || new Error('MediaPipeの読み込みに失敗しました');
  }
  PoseLandmarker = mod.PoseLandmarker;
  FilesetResolver = mod.FilesetResolver;
}

async function createPoseLandmarker(){
  if(poseLandmarker) return;
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    numPoses: 1,
    minPoseDetectionConfidence: 0.55,
    minPosePresenceConfidence: 0.55,
    minTrackingConfidence: 0.55,
    outputSegmentationMasks: false
  });
}

async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error('カメラが使えません。HTTPS、localhost、またはfile:///で開いてください。');
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:'user',
      width:{ideal:1280},
      height:{ideal:720},
      frameRate:{ideal:30,max:60}
    }
  });
  video.srcObject = stream;
  await video.play();
}

startBtn.onclick = async ()=>{
  if(started) return;
  startBtn.disabled = true;
  try{
    showToast('カメラ許可が出たら許可してください。逃げるとアバターも逃げます。');
    await loadMediaPipe();
    await createPoseLandmarker();
    await startCamera();
    started = true;
    liveDot.classList.add('on');
    liveText.textContent = 'camera on';
    subStatus.textContent = '起動中';
    startBtn.textContent = '起動済み';
    fitCanvas();
    renderLoop();
  }catch(err){
    console.error(err);
    startBtn.disabled = false;
    startBtn.textContent = '再試行';
    subStatus.textContent = '起動失敗';
    liveText.textContent = 'camera error';
    showToast(err?.message || '起動に失敗しました');
  }
};

function mirrorLandmarks(landmarks){
  return landmarks.map(p => ({...p, x: 1 - p.x}));
}

function smoothLandmarks(next){
  if(!next) return smoothed;
  const mirrored = mirrorLandmarks(next);
  if(!smoothed){
    smoothed = mirrored.map(p=>({...p}));
    return smoothed;
  }
  const alpha = 0.38;
  for(let i=0;i<mirrored.length;i++){
    const n = mirrored[i];
    const s = smoothed[i] || n;
    const visible = (n.visibility ?? 1) > 0.35;
    if(visible){
      s.x += (n.x - s.x) * alpha;
      s.y += (n.y - s.y) * alpha;
      s.z += ((n.z || 0) - (s.z || 0)) * alpha;
      s.visibility = n.visibility ?? 1;
    }else{
      s.visibility = (s.visibility || 0) * .92;
    }
    smoothed[i] = s;
  }
  return smoothed;
}

function trackingScore(lm){
  if(!lm) return 0;
  let total = 0;
  for(const i of KEYPOINTS){ total += lm[i]?.visibility ?? 0; }
  return Math.max(0, Math.min(1, total / KEYPOINTS.length));
}

function rectContain(srcAspect, dst){
  const dstAspect = dst.w / dst.h;
  let w,h,x,y;
  if(srcAspect > dstAspect){ w = dst.w; h = w / srcAspect; x = dst.x; y = dst.y + (dst.h - h)/2; }
  else { h = dst.h; w = h * srcAspect; x = dst.x + (dst.w - w)/2; y = dst.y; }
  return {x,y,w,h};
}
function rectCover(srcAspect, dst){
  const dstAspect = dst.w / dst.h;
  let w,h,x,y;
  if(srcAspect > dstAspect){ h = dst.h; w = h * srcAspect; x = dst.x + (dst.w - w)/2; y = dst.y; }
  else { w = dst.w; h = w / srcAspect; x = dst.x; y = dst.y + (dst.h - h)/2; }
  return {x,y,w,h};
}

function drawMirroredVideo(dst, fit='cover', alpha=1){
  if(!video.videoWidth) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const srcAspect = video.videoWidth / video.videoHeight;
  const r = fit === 'contain' ? rectContain(srcAspect, dst) : rectCover(srcAspect, dst);
  ctx.translate(r.x + r.w, r.y);
  ctx.scale(-1,1);
  ctx.drawImage(video, 0, 0, r.w, r.h);
  ctx.restore();
}

function project(p, dst, pad=0){
  return { x: dst.x + pad + p.x * (dst.w - pad*2), y: dst.y + pad + p.y * (dst.h - pad*2), z:p.z || 0, v:p.visibility ?? 1 };
}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2,v:Math.min(a.v??1,b.v??1)}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}

function drawCapsule(a,b,width,fill,stroke=null){
  const len = dist(a,b);
  if(!isFinite(len) || len < 2) return;
  const ang = angle(a,b);
  ctx.save();
  ctx.translate(a.x,a.y);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.roundRect(0,-width/2,len,width,width/2);
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.lineWidth = Math.max(1,width*.08); ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}
function drawJoint(p,r,fill,stroke='rgba(255,255,255,.7)'){
  if(!p || p.v < .2) return;
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = Math.max(1,r*.18); ctx.strokeStyle=stroke; ctx.stroke();
}

function getPts(lm, dst, pad=0){
  const p = {};
  for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28,31,32]) p[i] = project(lm[i], dst, pad);
  p.neck = mid(p[11], p[12]);
  p.chest = mid(p.neck, mid(p[23], p[24]));
  p.hips = mid(p[23], p[24]);
  p.head = p[0];
  return p;
}

function bodyScale(p){
  const shoulder = dist(p[11],p[12]);
  const torso = dist(p.neck,p.hips);
  return Math.max(8, Math.min(80, (shoulder + torso) * .18));
}

function drawCoolAvatar(lm, dst){
  const p = getPts(lm, dst, Math.min(dst.w,dst.h)*0.02);
  const s = bodyScale(p);
  const shoulderW = dist(p[11],p[12]);
  const hipW = dist(p[23],p[24]);
  const torsoW = Math.max(shoulderW, hipW) * .52;

  ctx.save();
  ctx.shadowColor = 'rgba(120,240,255,.35)';
  ctx.shadowBlur = s*.45;

  // coat / body
  const coatLeft = {x:p[11].x - torsoW*.22, y:p[11].y};
  const coatRight = {x:p[12].x + torsoW*.22, y:p[12].y};
  const coatBottomL = {x:p[23].x - torsoW*.55, y:p[23].y + s*2.8};
  const coatBottomR = {x:p[24].x + torsoW*.55, y:p[24].y + s*2.8};
  ctx.beginPath();
  ctx.moveTo(coatLeft.x, coatLeft.y);
  ctx.lineTo(coatRight.x, coatRight.y);
  ctx.lineTo(coatBottomR.x, coatBottomR.y);
  ctx.quadraticCurveTo(p.hips.x,p.hips.y+s*3.3,coatBottomL.x,coatBottomL.y);
  ctx.closePath();
  const grad = ctx.createLinearGradient(p.neck.x,p.neck.y,p.hips.x,p.hips.y+s*3);
  grad.addColorStop(0,'rgba(32,40,68,.95)');
  grad.addColorStop(1,'rgba(6,10,20,.96)');
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = Math.max(2,s*.13); ctx.strokeStyle = 'rgba(120,240,255,.52)'; ctx.stroke();

  // torso core
  ctx.beginPath();
  ctx.moveTo(p[11].x, p[11].y + s*.2);
  ctx.lineTo(p[12].x, p[12].y + s*.2);
  ctx.lineTo(p[24].x, p[24].y);
  ctx.lineTo(p[23].x, p[23].y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(16,23,43,.94)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.stroke();

  // limbs
  const armFill = 'rgba(34,45,76,.98)';
  const legFill = 'rgba(22,29,52,.98)';
  drawCapsule(p[11],p[13],s*.72,armFill,'rgba(120,240,255,.32)');
  drawCapsule(p[13],p[15],s*.60,armFill,'rgba(120,240,255,.32)');
  drawCapsule(p[12],p[14],s*.72,armFill,'rgba(120,240,255,.32)');
  drawCapsule(p[14],p[16],s*.60,armFill,'rgba(120,240,255,.32)');
  drawCapsule(p[23],p[25],s*.82,legFill,'rgba(120,240,255,.24)');
  drawCapsule(p[25],p[27],s*.68,legFill,'rgba(120,240,255,.24)');
  drawCapsule(p[24],p[26],s*.82,legFill,'rgba(120,240,255,.24)');
  drawCapsule(p[26],p[28],s*.68,legFill,'rgba(120,240,255,.24)');

  // boots / gloves
  for(const i of [15,16]) drawJoint(p[i],s*.38,'rgba(120,240,255,.9)','rgba(255,255,255,.8)');
  for(const i of [27,28]) drawCapsule({x:p[i].x-s*.5,y:p[i].y+s*.12},{x:p[i].x+s*.6,y:p[i].y+s*.12},s*.42,'rgba(5,7,12,.95)','rgba(120,240,255,.38)');

  // collar
  ctx.beginPath();
  ctx.moveTo(p.neck.x,p.neck.y+s*.25);
  ctx.lineTo(p[11].x-s*.55,p[11].y-s*.1);
  ctx.lineTo(p[11].x+s*.18,p[11].y+s*.65);
  ctx.closePath(); ctx.fillStyle='rgba(120,240,255,.28)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(p.neck.x,p.neck.y+s*.25);
  ctx.lineTo(p[12].x+s*.55,p[12].y-s*.1);
  ctx.lineTo(p[12].x-s*.18,p[12].y+s*.65);
  ctx.closePath(); ctx.fill();

  // head
  const headR = Math.max(s*1.05, shoulderW*.18);
  const head = {x:p.head.x, y:p.head.y - headR*.10};
  ctx.beginPath();
  ctx.roundRect(head.x-headR*.78, head.y-headR*.92, headR*1.56, headR*1.72, headR*.45);
  ctx.fillStyle = 'rgba(18,25,43,.98)'; ctx.fill();
  ctx.lineWidth = Math.max(2,s*.10); ctx.strokeStyle = 'rgba(120,240,255,.66)'; ctx.stroke();
  // visor
  ctx.beginPath();
  ctx.roundRect(head.x-headR*.58, head.y-headR*.28, headR*1.16, headR*.38, headR*.18);
  const visor = ctx.createLinearGradient(head.x-headR*.58,0,head.x+headR*.58,0);
  visor.addColorStop(0,'rgba(120,240,255,.95)'); visor.addColorStop(1,'rgba(255,122,217,.86)');
  ctx.fillStyle = visor; ctx.fill();
  // hair spikes
  ctx.beginPath();
  ctx.moveTo(head.x-headR*.55, head.y-headR*.74);
  ctx.lineTo(head.x-headR*.22, head.y-headR*1.25);
  ctx.lineTo(head.x, head.y-headR*.82);
  ctx.lineTo(head.x+headR*.28, head.y-headR*1.22);
  ctx.lineTo(head.x+headR*.58, head.y-headR*.70);
  ctx.closePath(); ctx.fillStyle='rgba(5,7,12,.98)'; ctx.fill();

  // center glow
  ctx.beginPath(); ctx.arc(p.chest.x,p.chest.y,s*.28,0,Math.PI*2); ctx.fillStyle='rgba(120,240,255,.9)'; ctx.fill();
  ctx.restore();
}

function drawCuteAvatar(lm, dst){
  const p = getPts(lm, dst, Math.min(dst.w,dst.h)*0.02);
  const s = bodyScale(p);
  const shoulderW = dist(p[11],p[12]);
  const hipW = dist(p[23],p[24]);

  ctx.save();
  ctx.shadowColor = 'rgba(255,122,217,.28)';
  ctx.shadowBlur = s*.38;

  // limbs behind
  drawCapsule(p[11],p[13],s*.78,'rgba(255,187,224,.96)','rgba(255,255,255,.55)');
  drawCapsule(p[13],p[15],s*.64,'rgba(255,205,234,.96)','rgba(255,255,255,.55)');
  drawCapsule(p[12],p[14],s*.78,'rgba(255,187,224,.96)','rgba(255,255,255,.55)');
  drawCapsule(p[14],p[16],s*.64,'rgba(255,205,234,.96)','rgba(255,255,255,.55)');
  drawCapsule(p[23],p[25],s*.82,'rgba(128,226,255,.94)','rgba(255,255,255,.45)');
  drawCapsule(p[25],p[27],s*.66,'rgba(128,226,255,.94)','rgba(255,255,255,.45)');
  drawCapsule(p[24],p[26],s*.82,'rgba(128,226,255,.94)','rgba(255,255,255,.45)');
  drawCapsule(p[26],p[28],s*.66,'rgba(128,226,255,.94)','rgba(255,255,255,.45)');

  // hoodie body
  const bodyW = Math.max(shoulderW, hipW) * .86;
  const bodyH = Math.max(s*3.2, dist(p.neck,p.hips)*1.22);
  const bx = p.chest.x - bodyW/2;
  const by = p.neck.y - s*.05;
  ctx.beginPath();
  ctx.roundRect(bx, by, bodyW, bodyH, s*.75);
  const g = ctx.createLinearGradient(0,by,0,by+bodyH);
  g.addColorStop(0,'rgba(255,146,211,.98)');
  g.addColorStop(1,'rgba(255,213,239,.98)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth=Math.max(2,s*.10); ctx.strokeStyle='rgba(255,255,255,.72)'; ctx.stroke();
  // pocket
  ctx.beginPath();
  ctx.roundRect(p.chest.x-bodyW*.24, by+bodyH*.52, bodyW*.48, bodyH*.20, s*.24);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();

  // hands / shoes
  for(const i of [15,16]) drawJoint(p[i],s*.46,'rgba(255,244,251,.98)','rgba(255,122,217,.58)');
  for(const i of [27,28]) drawCapsule({x:p[i].x-s*.5,y:p[i].y+s*.1},{x:p[i].x+s*.58,y:p[i].y+s*.1},s*.46,'rgba(255,255,255,.96)','rgba(120,240,255,.46)');

  // head with ears
  const headR = Math.max(s*1.28, shoulderW*.22);
  const head = {x:p.head.x, y:p.head.y - headR*.06};
  ctx.beginPath(); ctx.arc(head.x-headR*.58, head.y-headR*.74, headR*.34,0,Math.PI*2); ctx.fillStyle='rgba(255,177,223,.98)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(head.x+headR*.58, head.y-headR*.74, headR*.34,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(head.x-headR*.84, head.y-headR*.84, headR*1.68, headR*1.58, headR*.72);
  ctx.fillStyle='rgba(255,236,247,.98)'; ctx.fill();
  ctx.lineWidth=Math.max(2,s*.10); ctx.strokeStyle='rgba(255,122,217,.46)'; ctx.stroke();
  // face
  ctx.beginPath(); ctx.arc(head.x-headR*.28, head.y-headR*.10, headR*.09,0,Math.PI*2); ctx.fillStyle='rgba(42,48,72,.92)'; ctx.fill();
  ctx.beginPath(); ctx.arc(head.x+headR*.28, head.y-headR*.10, headR*.09,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x, head.y+headR*.08, headR*.07,0,Math.PI*2); ctx.fillStyle='rgba(255,122,217,.86)'; ctx.fill();
  ctx.beginPath(); ctx.arc(head.x-headR*.42, head.y+headR*.1, headR*.11,0,Math.PI*2); ctx.fillStyle='rgba(255,150,200,.35)'; ctx.fill();
  ctx.beginPath(); ctx.arc(head.x+headR*.42, head.y+headR*.1, headR*.11,0,Math.PI*2); ctx.fill();
  // hoodie strings
  ctx.strokeStyle='rgba(255,255,255,.76)'; ctx.lineWidth=Math.max(2,s*.08); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p.neck.x-s*.28,p.neck.y+s*.2); ctx.lineTo(p.neck.x-s*.14,p.neck.y+s*1.1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.neck.x+s*.28,p.neck.y+s*.2); ctx.lineTo(p.neck.x+s*.14,p.neck.y+s*1.1); ctx.stroke();
  ctx.restore();
}

function drawAvatar(lm, dst){
  if(!lm) return;
  if(characterSelect.value === 'cool') drawCoolAvatar(lm, dst);
  else drawCuteAvatar(lm, dst);
}

function drawSkeleton(lm, dst, opts={}){
  if(!lm) return;
  const pad = opts.pad || 0;
  const pts = lm.map(p=>project(p,dst,pad));
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const [a,b] of CONNECTORS){
    if((pts[a].v ?? 1) < .25 || (pts[b].v ?? 1) < .25) continue;
    ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y);
    ctx.lineWidth=opts.lineWidth || 4;
    ctx.strokeStyle=opts.stroke || 'rgba(120,240,255,.82)'; ctx.stroke();
  }
  for(const i of KEYPOINTS){
    if((pts[i].v ?? 1) < .25) continue;
    ctx.beginPath(); ctx.arc(pts[i].x,pts[i].y,opts.radius || 5,0,Math.PI*2); ctx.fillStyle=opts.fill || 'rgba(255,255,255,.95)'; ctx.fill();
  }
  if(opts.labels){
    ctx.font = `${Math.max(10, Math.round(canvas.height*.014))}px system-ui`;
    ctx.fillStyle='rgba(255,255,255,.86)';
    for(const i of Object.keys(LABELS)){
      const p = pts[i]; if(!p || p.v < .25) continue;
      ctx.fillText(LABELS[i], p.x+8, p.y-8);
    }
  }
  ctx.restore();
}

function drawTestLinks(lm, left, right){
  if(!lm) return;
  const lpts = lm.map(p=>project(p,left,Math.min(left.w,left.h)*.02));
  const rpts = lm.map(p=>project(p,right,Math.min(right.w,right.h)*.02));
  ctx.save();
  ctx.lineWidth = Math.max(1.5, canvas.width*.0022);
  ctx.setLineDash([7,8]);
  for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
    const a = lpts[i], b = rpts[i];
    if(!a || !b || a.v < .3 || b.v < .3) continue;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    const c1x = left.x + left.w + (right.x-left.x-left.w)*.35;
    const c2x = left.x + left.w + (right.x-left.x-left.w)*.65;
    ctx.bezierCurveTo(c1x,a.y,c2x,b.y,b.x,b.y);
    ctx.strokeStyle = i%2 ? 'rgba(120,240,255,.36)' : 'rgba(255,122,217,.36)';
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function roundedPanel(r, title){
  ctx.save();
  ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,24); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.035)'; ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,24); ctx.stroke();
  ctx.font = `${Math.max(13, Math.round(canvas.height*.022))}px system-ui`;
  ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fillText(title, r.x+16, r.y+30);
  ctx.restore();
}

function drawBackground(){
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createRadialGradient(w*.5,h*.2,10,w*.5,h*.45,Math.max(w,h)*.72);
  grad.addColorStop(0,'#172335'); grad.addColorStop(1,'#050609');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.globalAlpha=.20; ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  const step = Math.max(36, Math.round(Math.min(w,h)/12));
  for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();
}

function drawNoPose(){
  const now = performance.now();
  if(now - lastToastAt > 2400){
    lastToastAt = now;
    showToast('体が検出できません。カメラから少し離れて、肩・腰・膝が入るようにしてください。');
  }
  ctx.save();
  ctx.fillStyle='rgba(5,6,9,.52)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font = `${Math.max(16, Math.round(canvas.height*.028))}px system-ui`;
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillText('全身が入る位置に立つと追従します', canvas.width/2, canvas.height/2);
  ctx.restore();
}

function drawAvatarMode(lm){
  const dst = {x:0,y:0,w:canvas.width,h:canvas.height};
  if(bgToggle.checked) drawMirroredVideo(dst,'cover',.92); else drawBackground();
  if(!lm){ drawNoPose(); return; }
  drawAvatar(lm,dst);
  if(debugToggle.checked) drawSkeleton(lm,dst,{stroke:'rgba(120,240,255,.75)',fill:'rgba(255,255,255,.9)',lineWidth:Math.max(2,canvas.width*.004),radius:Math.max(3,canvas.width*.005)});
}

function drawTestMode(lm){
  drawBackground();
  const gap = Math.max(18, canvas.width*.025);
  const margin = Math.max(12, canvas.width*.018);
  const panelW = (canvas.width - margin*2 - gap)/2;
  const panelH = canvas.height - margin*2;
  const left = {x:margin,y:margin,w:panelW,h:panelH};
  const right = {x:margin+panelW+gap,y:margin,w:panelW,h:panelH};
  roundedPanel(left,'REAL'); roundedPanel(right,'AVATAR');
  ctx.save(); ctx.beginPath(); ctx.roundRect(left.x,left.y,left.w,left.h,24); ctx.clip(); drawMirroredVideo(left,'contain',.95); ctx.restore();
  if(!lm){ drawNoPose(); return; }
  drawSkeleton(lm,left,{stroke:'rgba(120,240,255,.72)',fill:'rgba(255,255,255,.92)',lineWidth:Math.max(2,canvas.width*.003),radius:Math.max(3,canvas.width*.004),labels:true,pad:Math.min(left.w,left.h)*.02});
  drawTestLinks(lm,left,right);
  ctx.save(); ctx.beginPath(); ctx.roundRect(right.x,right.y,right.w,right.h,24); ctx.clip(); drawAvatar(lm,right); ctx.restore();
}

function renderLoop(){
  fitCanvas();
  if(video.readyState >= 2 && poseLandmarker && video.currentTime !== lastVideoTime){
    try{
      // Modern MediaPipe accepts a timestamp argument. Some builds also accept only the video.
      lastResult = poseLandmarker.detectForVideo.length >= 2
        ? poseLandmarker.detectForVideo(video, performance.now())
        : poseLandmarker.detectForVideo(video);
      lastVideoTime = video.currentTime;
    }catch(e){
      console.error(e);
    }
  }
  const raw = lastResult?.landmarks?.[0] || null;
  const lm = raw ? smoothLandmarks(raw) : null;
  const score = trackingScore(lm);
  trackingMeter.style.width = `${Math.round(score*100)}%`;
  subStatus.textContent = score > .55 ? '追従中' : (started ? '検出待ち' : '未起動');
  if(mode === 'avatar') drawAvatarMode(lm); else drawTestMode(lm);

  const now = performance.now();
  fps = fps * .88 + (1000 / Math.max(1, now - lastFrameTs)) * .12;
  lastFrameTs = now;
  fpsEl.textContent = Math.round(fps);
  rafId = requestAnimationFrame(renderLoop);
}

// Initial paint
fitCanvas();
drawBackground();
ctx.save();
ctx.font = `${Math.max(18, Math.round(canvas.height*.032))}px system-ui`;
ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.9)';
ctx.fillText('開始を押す', canvas.width/2, canvas.height/2 - 12);
ctx.font = `${Math.max(12, Math.round(canvas.height*.020))}px system-ui`;
ctx.fillStyle='rgba(255,255,255,.62)';
ctx.fillText('アバターは体の動きに合わせてリアルタイムで動きます', canvas.width/2, canvas.height/2 + 24);
ctx.restore();

window.addEventListener('beforeunload',()=>{
  cancelAnimationFrame(rafId);
  const stream = video.srcObject;
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
