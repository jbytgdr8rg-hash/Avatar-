<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Lunarelle VRM Avatar Size Fix App</title>
  <style>
    :root{
      --bg:#070813; --panel:rgba(13,16,30,.78); --panel2:rgba(255,255,255,.075); --line:rgba(255,255,255,.14);
      --text:#f6f2ff; --muted:#aaa4c6; --violet:#8a6fd1; --gold:#d8c49a; --cyan:#88eaff; --ok:#8dffb4; --bad:#ff647d;
      --shadow:0 18px 48px rgba(0,0,0,.46);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 30% 12%,#1e2756 0,#080914 48%,#03040a 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:manipulation}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;min-height:54px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:38px;height:38px;border-radius:14px;background:conic-gradient(from 30deg,#d8c49a,#8a6fd1,#1e2756,#c7b6e6,#d8c49a);box-shadow:0 0 22px rgba(199,182,230,.32);position:relative}.mark:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.65)}
    h1{margin:0;font-size:16px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);white-space:nowrap}.status{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}.status strong{color:#fff;font-weight:700}
    .stage{position:relative;min-height:0;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:#03040a;box-shadow:var(--shadow)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hiddenVideo{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    .badge{position:absolute;left:12px;top:12px;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(3,4,10,.62);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:12px;color:#eee9ff}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px currentColor}.dot.on{background:var(--ok)}.meter{width:96px;height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}.meter span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold));transition:width .12s linear}
    .help{position:absolute;right:12px;top:12px;z-index:10;max-width:62%;padding:8px 10px;border-radius:999px;background:rgba(3,4,10,.62);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);font-size:12px;color:#eee9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;max-width:min(740px,calc(100% - 24px));padding:12px 14px;border-radius:16px;background:rgba(3,4,10,.86);border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow);font-size:13px;color:#fff}.toast.show{display:block}
    .controls{display:grid;grid-template-columns:1fr;gap:8px;padding-bottom:10px}.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    button,select,label.toggle,.fileBtn{appearance:none;border:1px solid rgba(255,255,255,.15);background:var(--panel);color:var(--text);border-radius:15px;padding:11px 13px;font-size:14px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(14px)}button,.fileBtn{font-weight:700;cursor:pointer}button.primary{border-color:rgba(199,182,230,.54);background:linear-gradient(135deg,rgba(138,111,209,.35),rgba(216,196,154,.16))}button.active{border-color:rgba(216,196,154,.56);background:linear-gradient(135deg,rgba(138,111,209,.35),rgba(255,138,216,.15))}button:disabled{opacity:.55;cursor:not-allowed}button:active,.fileBtn:active{transform:translateY(1px)}select{padding-right:28px}label.toggle{display:flex;gap:8px;align-items:center}.toggle input{accent-color:#8a6fd1}
    .small{font-size:12px;color:var(--muted)}
    input[type=file]{display:none}
    @media (min-width:900px){.app{padding-left:18px;padding-right:18px}.controls{grid-template-columns:auto auto;justify-content:space-between;align-items:center}.row:first-child{justify-content:flex-start}.row:last-child{justify-content:flex-end}h1{font-size:18px}.stage{border-radius:30px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="mark"></div><div><h1>Lunarelle VRM Avatar Size Fix</h1><div class="sub" id="subStatus">未起動 / 内蔵VRM待機</div></div></div>
      <div class="status"><strong id="fps">0</strong> fps<br><span id="modeText">アバターモード</span></div>
    </header>

    <main class="stage" id="stage">
      <video id="video" class="hiddenVideo" autoplay playsinline muted></video>
      <canvas id="videoLayer"></canvas>
      <canvas id="webglLayer"></canvas>
      <canvas id="linkLayer"></canvas>
      <div class="badge"><span class="dot" id="liveDot"></span><span id="liveText">camera off</span><div class="meter"><span id="trackingMeter"></span></div></div>
      <div class="help" id="helpText">開始を押して、肩・腰・膝まで入る位置に立つ</div>
      <div class="toast" id="toast"></div>
    </main>

    <section class="controls">
      <div class="row">
        <button id="startBtn" class="primary">開始</button>
        <button id="avatarModeBtn" class="active">アバターモード</button>
        <button id="testModeBtn">テストモード</button>
      </div>
      <div class="row">
        <button id="loadBuiltInBtn">内蔵VRMを読み込む</button>
        <label for="vrmFileInput" class="fileBtn">.vrmを選ぶ</label>
        <input id="vrmFileInput" type="file" accept=".vrm,.glb,.gltf,model/gltf-binary" />
        <label class="toggle"><input id="bgToggle" type="checkbox" checked>リアル背景</label>
        <label class="toggle"><input id="debugToggle" type="checkbox">骨格</label>
        <span class="small" id="modelName">モデル: 未読込</span>
      </div>
    </section>
  </div>

function showToast(message){

function fitCanvases(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const w = Math.max(2, Math.round(r.width * dpr));
  const h = Math.max(2, Math.round(r.height * dpr));
  for(const c of [videoCanvas, glCanvas, linkCanvas]){
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  }
  if(renderer){ renderer.setSize(w, h, false); renderer.setPixelRatio(1); }
}
window.addEventListener('resize', fitCanvases);

async function loadMediaPipe(){
  if(PoseLandmarker && FilesetResolver) return;
  subStatus.textContent = '姿勢推定を読み込み中';
  const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs');
  PoseLandmarker = mod.PoseLandmarker;
  FilesetResolver = mod.FilesetResolver;
}
async function createPoseLandmarker(){
  if(poseLandmarker) return;
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU'
    },
    runningMode:'VIDEO', numPoses:1,
    minPoseDetectionConfidence:.55, minPosePresenceConfidence:.55, minTrackingConfidence:.55,
    outputSegmentationMasks:false
  });
}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error('カメラが使えません。HTTPS環境で開いてください。');
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,max:60}}
  });
  video.srcObject = stream;
  await video.play();
}

function initThree(){
  if(renderer) return;
  renderer = new THREE.WebGLRenderer({canvas:glCanvas, alpha:true, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(1);
  renderer.setSize(glCanvas.width, glCanvas.height, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-3,3,3,-3,.1,100);
  camera.position.set(0,0,10); camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff,.92));
  const key = new THREE.DirectionalLight(0xffffff,1.28); key.position.set(2,3,5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xb4c7e7,.65); rim.position.set(-2,1,3); scene.add(rim);
  avatarRoot = new THREE.Group(); scene.add(avatarRoot);
}

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function loadVRMFromArrayBuffer(arrayBuffer, label='読み込みVRM'){
  initThree();
  subStatus.textContent = 'VRMを読み込み中';
  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  const gltf = await loader.parseAsync(arrayBuffer, './');
  const vrm = gltf.userData.vrm;
  if(!vrm) throw new Error('VRMとして認識できませんでした');
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.removeUnnecessaryJoints(gltf.scene);
  if(currentVRM){ avatarRoot.remove(currentVRM.scene); }
  currentVRM = vrm;
  currentVRM.scene.rotation.y = Math.PI;
  currentVRM.scene.position.set(0,0,0);
  currentVRM.scene.scale.setScalar(1);
  avatarRoot.add(currentVRM.scene);

  const bbox = new THREE.Box3().setFromObject(currentVRM.scene);
  const size = new THREE.Vector3(); bbox.getSize(size);
  const hipsBone = currentVRM.humanoid.getNormalizedBoneNode('hips');
  const hipsPos = hipsBone ? hipsBone.position.clone() : new THREE.Vector3(0,1,0);
  currentModelMeta = {
    label,
    naturalHeight: Math.max(0.01, size.y),
    naturalMinY: bbox.min.y,
    naturalMaxY: bbox.max.y,
    naturalHipY: hipsPos.y,
    bones: {},
    baseQuat: {},
    basePos: {}
  };
  for(const name of BONE_NAMES){
    const node = currentVRM.humanoid.getNormalizedBoneNode(name);
    if(node){
      currentModelMeta.bones[name] = node;
      currentModelMeta.baseQuat[name] = node.quaternion.clone();
      currentModelMeta.basePos[name] = node.position.clone();
    }
  }
  modelNameEl.textContent = `モデル: ${label}`;
  subStatus.textContent = `モデル読込済み: ${label}`;
  showToast(`VRMを読み込みました: ${label}`);
  if(renderer) drawFrame(null);
}

async function loadBuiltInVRM(){
  try{
    loadBuiltInBtn.disabled = true;
    await loadVRMFromArrayBuffer(base64ToArrayBuffer(EMBEDDED_VRM_B64), '内蔵ルナレル試作VRM サイズ補正版');
  }catch(err){
    console.error(err);
    showToast(err?.message || '内蔵VRMの読み込みに失敗しました');
    loadBuiltInBtn.disabled = false;
  }
}

loadBuiltInBtn.onclick = ()=>loadBuiltInVRM();
vrmFileInput.onchange = async (e)=>{
  const file = e.target.files?.[0];
  if(!file) return;
  try{
    const buffer = await file.arrayBuffer();
    await loadVRMFromArrayBuffer(buffer, file.name);
  }catch(err){
    console.error(err);
    showToast(err?.message || 'ファイル読み込みに失敗しました');
  }finally{
    vrmFileInput.value = '';
  }
};

startBtn.onclick = async ()=>{
  if(started) return;
  startBtn.disabled = true;
  try{
    showToast('カメラ許可が出たら許可。全身が入る位置まで少し下がると安定します。');
    fitCanvases(); initThree();
    if(!currentVRM) await loadBuiltInVRM();
    await loadMediaPipe(); await createPoseLandmarker(); await startCamera();
    started = true;
    liveDot.classList.add('on'); liveText.textContent = 'camera on';
    subStatus.textContent = '起動中'; startBtn.textContent = '起動済み';
    renderLoop();
  }catch(err){
    console.error(err);
    startBtn.disabled = false; startBtn.textContent = '再試行'; liveText.textContent = 'camera error'; subStatus.textContent = '起動失敗';
    showToast(err?.message || '起動に失敗しました');
  }
};

function mirrorLandmarks(landmarks){ return landmarks.map(p=>({...p, x:1-p.x})); }
function smoothLandmarks(next){
  if(!next) return smoothed;
  const mirrored = mirrorLandmarks(next);
  if(!smoothed){ smoothed = mirrored.map(p=>({...p})); return smoothed; }
  const alpha = .36;
  for(let i=0;i<mirrored.length;i++){
    const n = mirrored[i], s = smoothed[i] || n;
    if((n.visibility ?? 1) > .25){
      s.x += (n.x-s.x)*alpha; s.y += (n.y-s.y)*alpha; s.z = (s.z || 0) + ((n.z || 0)-(s.z || 0))*alpha; s.visibility = n.visibility ?? 1;
    }else{ s.visibility = (s.visibility || 0)*.92; }
    smoothed[i] = s;
  }
  return smoothed;
}
function trackingScore(lm){ if(!lm) return 0; return KEYPOINTS.reduce((a,i)=>a+(lm[i]?.visibility??0),0)/KEYPOINTS.length; }
function screenToWorld(p){
  return {
    x:(p.x - .5) * viewWidth,
    y:(.5 - p.y) * viewHeight,
    z:-(p.z || 0) * viewWidth * .42,
    v:p.visibility ?? 1
  };
}
function midpoint(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2,v:Math.min(a.v??1,b.v??1)}; }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0)); }
function angle2(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function setBoneRotZ(name, radians){
  const bone = currentModelMeta?.bones?.[name];
  const base = currentModelMeta?.baseQuat?.[name];
  if(!bone || !base) return;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,radians));
  bone.quaternion.copy(base).multiply(q);
}
function setBoneRot(name, x=0, y=0, z=0){
  const bone = currentModelMeta?.bones?.[name];
  const base = currentModelMeta?.baseQuat?.[name];
  if(!bone || !base) return;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z,'XYZ'));
  bone.quaternion.copy(base).multiply(q);
}
function resetBones(){
  if(!currentModelMeta) return;
  for(const name of Object.keys(currentModelMeta.bones)){
    currentModelMeta.bones[name].quaternion.copy(currentModelMeta.baseQuat[name]);
    currentModelMeta.bones[name].position.copy(currentModelMeta.basePos[name]);
  }
}

function isGoodPoint(p, min=.25){ return !!p && (p.v ?? 0) >= min && Number.isFinite(p.x) && Number.isFinite(p.y); }
function bothGood(a,b,min=.25){ return isGoodPoint(a,min) && isGoodPoint(b,min); }
function safeAngle(a,b,fallback=0){ return bothGood(a,b,.25) ? angle2(a,b) : fallback; }

function setIdleVRMPose(){
  if(!currentVRM || !currentModelMeta){ if(avatarRoot) avatarRoot.visible = false; return; }
  avatarRoot.visible = true;
  resetBones();
  const scale = clamp((viewHeight * .82) / currentModelMeta.naturalHeight, 1.45, 5.2);
  avatarRoot.scale.setScalar(scale);
  const centerY = (currentModelMeta.naturalMinY + currentModelMeta.naturalMaxY) * 0.5;
  avatarRoot.position.set(0, clamp(-centerY * scale, -viewHeight*.42, -viewHeight*.08), 0);
  setBoneRot('leftUpperArm', 0, 0, -.55);
  setBoneRot('leftLowerArm', 0, 0, -.08);
  setBoneRot('rightUpperArm', 0, 0, .55);
  setBoneRot('rightLowerArm', 0, 0, .08);
  currentVRM.update(1/60);
}

function updateVRMAvatar(lm){
  if(!currentVRM || !currentModelMeta){ if(avatarRoot) avatarRoot.visible = false; return; }
  if(!lm){ setIdleVRMPose(); return; }

  avatarRoot.visible = true;
  const p = {};
  for(const i of KEYPOINTS){ p[i] = screenToWorld(lm[i]); }
  p.neck = midpoint(p[11], p[12]);
  p.shoulders = midpoint(p[11], p[12]);

  const shoulderW = bothGood(p[11], p[12]) ? dist(p[11], p[12]) : 1.0;
  const hipsVisible = bothGood(p[23], p[24], .30);
  const anklesVisible = bothGood(p[27], p[28], .30);

  p.hips = hipsVisible
    ? midpoint(p[23], p[24])
    : {x:p.shoulders.x, y:p.shoulders.y - Math.max(1.15, shoulderW * 2.55), z:p.shoulders.z, v:.55};
  p.ankles = anklesVisible
    ? midpoint(p[27], p[28])
    : {x:p.hips.x, y:p.hips.y - Math.max(1.6, shoulderW * 3.0), z:p.hips.z, v:.35};

  // 表示安定化：MediaPipeは上半身だけ映ると腰・足首が画面外に飛びやすい。
  // その値をそのままVRMの原点に使うと、読み込み済みなのに画面外へ消える。
  // 肩幅を主スケールにし、腰アンカーは画面内にクランプする。
  // サイズ補正：iPhoneの近距離・上半身のみの検出では、肩幅や推定腰から全身サイズを逆算すると
  // VRMが極端に小さくなる。ここではまず「必ず見える大きさ」を優先し、
  // スケールは画面高基準で固定、位置だけ肩中心に軽く追従させる。
  const desiredHeight = viewHeight * (mode === 'test' ? 0.78 : 0.86);
  const scale = clamp(desiredHeight / currentModelMeta.naturalHeight, 1.45, 5.2);
  avatarRoot.scale.setScalar(scale);

  // 試作VRMの肩位置は身長の約82%付近。厳密な骨座標ではなく、表示安定用の近似値。
  const naturalShoulderY = currentModelMeta.naturalMinY + currentModelMeta.naturalHeight * 0.82;
  const targetShoulderX = clamp(p.shoulders.x, -viewWidth * 0.26, viewWidth * 0.26);
  const targetShoulderY = clamp(p.shoulders.y, -viewHeight * 0.02, viewHeight * 0.28);
  const safeX = targetShoulderX;
  const safeY = clamp(targetShoulderY - naturalShoulderY * scale, -viewHeight * 0.46, -viewHeight * 0.12);
  avatarRoot.position.set(safeX, safeY, 0);

  resetBones();

  const torsoTilt = bothGood(p.hips, p.shoulders) ? angle2(p.hips, p.shoulders) - Math.PI/2 : 0;
  const bodyYaw = bothGood(p[11],p[12]) ? clamp((p[12].z - p[11].z) * 1.15, -.55, .55) : 0;
  const headYaw = bothGood(p[11],p[12]) ? clamp((p[12].z - p[11].z) * 1.5, -.8, .8) : 0;
  const headRoll = bothGood(p[11],p[12]) ? clamp((p[12].y - p[11].y) * .28, -.24, .24) : 0;
  const faceYawFromNose = isGoodPoint(p[0]) ? clamp((p[0].x - p.shoulders.x) * .6, -.3, .3) : 0;

  setBoneRot('hips', 0, bodyYaw * .35, torsoTilt * .42);
  setBoneRot('spine', 0, bodyYaw * .45, torsoTilt * .58);
  setBoneRot('chest', 0, bodyYaw * .65, torsoTilt * .72);
  setBoneRot('neck', 0, headYaw * .35 + faceYawFromNose * .25, headRoll * .35);
  setBoneRot('head', 0, headYaw + faceYawFromNose, headRoll);

  if(bothGood(p[11],p[13])) setBoneRotZ('leftUpperArm', safeAngle(p[11],p[13]));
  if(bothGood(p[13],p[15])) setBoneRotZ('leftLowerArm', safeAngle(p[13],p[15]));
  if(bothGood(p[12],p[14])) setBoneRotZ('rightUpperArm', safeAngle(p[12],p[14]) - Math.PI);
  if(bothGood(p[14],p[16])) setBoneRotZ('rightLowerArm', safeAngle(p[14],p[16]) - Math.PI);
  if(bothGood(p[23],p[25])) setBoneRotZ('leftUpperLeg', safeAngle(p[23],p[25]) + Math.PI/2);
  if(bothGood(p[25],p[27])) setBoneRotZ('leftLowerLeg', safeAngle(p[25],p[27]) + Math.PI/2);
  if(bothGood(p[24],p[26])) setBoneRotZ('rightUpperLeg', safeAngle(p[24],p[26]) + Math.PI/2);
  if(bothGood(p[26],p[28])) setBoneRotZ('rightLowerLeg', safeAngle(p[26],p[28]) + Math.PI/2);

  currentVRM.update(1/60);
}

function rectContain(srcAspect,dst){
  const a = dst.w/dst.h; let w,h,x,y;
  if(srcAspect>a){ w=dst.w; h=w/srcAspect; x=dst.x; y=dst.y+(dst.h-h)/2; }
  else{ h=dst.h; w=h*srcAspect; x=dst.x+(dst.w-w)/2; y=dst.y; }
  return {x,y,w,h};
}
function rectCover(srcAspect,dst){
  const a = dst.w/dst.h; let w,h,x,y;
  if(srcAspect>a){ h=dst.h; w=h*srcAspect; x=dst.x+(dst.w-w)/2; y=dst.y; }
  else{ w=dst.w; h=w/srcAspect; x=dst.x; y=dst.y+(dst.h-h)/2; }
  return {x,y,w,h};
}
function drawMirroredVideo(dst, fit='cover', alpha=1){
  if(!video.videoWidth) return;
  const srcAspect = video.videoWidth/video.videoHeight;
  const r = fit==='contain' ? rectContain(srcAspect,dst) : rectCover(srcAspect,dst);
  vctx.save(); vctx.globalAlpha = alpha; vctx.translate(r.x+r.w,r.y); vctx.scale(-1,1); vctx.drawImage(video,0,0,r.w,r.h); vctx.restore();
}
function drawFantasyBackground(ctx,w,h){
  const grad = ctx.createRadialGradient(w*.48,h*.18,10,w*.5,h*.48,Math.max(w,h)*.72);
  grad.addColorStop(0,'#1e2756'); grad.addColorStop(.55,'#090b1a'); grad.addColorStop(1,'#03040a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.globalAlpha=.18; ctx.strokeStyle='rgba(216,196,154,.25)'; ctx.lineWidth=1;
  const step = Math.max(36, Math.round(Math.min(w,h)/13));
  for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();
  ctx.save(); ctx.globalAlpha=.6; ctx.fillStyle='rgba(216,196,154,.55)';
  for(let i=0;i<38;i++){ const x=(i*97)%w, y=(i*211)%h, r=1+((i*17)%3); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawPanel(ctx,r,title){
  ctx.save(); ctx.fillStyle='rgba(255,255,255,.045)'; ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,24); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.stroke();
  ctx.font=`${Math.max(14, Math.round(videoCanvas.height*.022))}px system-ui`; ctx.fillStyle='rgba(255,255,255,.88)'; ctx.fillText(title,r.x+16,r.y+30); ctx.restore();
}
function project2D(p,dst,pad=0){ return {x:dst.x+pad+p.x*(dst.w-pad*2), y:dst.y+pad+p.y*(dst.h-pad*2), v:p.visibility??1}; }
function drawSkeleton(ctx,lm,dst,opt={}){
  if(!lm) return;
  const pad = opt.pad || 0;
  const pts = lm.map(p=>project2D(p,dst,pad));
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for(const [a,b] of CONNECTORS){ if((pts[a].v??1)<.25 || (pts[b].v??1)<.25) continue; ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y); ctx.lineWidth=opt.lineWidth||4; ctx.strokeStyle=opt.stroke||'rgba(180,199,231,.75)'; ctx.stroke(); }
  for(const i of KEYPOINTS){ const p=pts[i]; if(!p || p.v<.25) continue; ctx.beginPath(); ctx.arc(p.x,p.y,opt.radius||5,0,Math.PI*2); ctx.fillStyle=opt.fill||'rgba(255,255,255,.94)'; ctx.fill(); }
  ctx.restore();
}
function drawLinks(ctx,lm,left,right){
  if(!lm) return;
  const padL = Math.min(left.w,left.h)*.02; const padR = Math.min(right.w,right.h)*.02;
  const aPts = lm.map(p=>project2D(p,left,padL)); const bPts = lm.map(p=>project2D(p,right,padR));
  ctx.save(); ctx.setLineDash([7,8]); ctx.lineWidth=Math.max(1.5, linkCanvas.width*.0023);
  for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
    const a=aPts[i], b=bPts[i]; if(!a || !b || a.v<.3 || b.v<.3) continue;
    const c1x = left.x+left.w+(right.x-left.x-left.w)*.34; const c2x = left.x+left.w+(right.x-left.x-left.w)*.66;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(c1x,a.y,c2x,b.y,b.x,b.y); ctx.strokeStyle = i%2 ? 'rgba(180,199,231,.42)' : 'rgba(216,196,154,.42)'; ctx.stroke();
  }
  ctx.restore();
}
function drawNoPose(ctx,w,h){
  const now = performance.now();
  if(now-lastNoPoseToast > 2500){ lastNoPoseToast = now; showToast('体が検出できません。肩・腰・膝が画面に入るように下がってください。'); }
  ctx.save(); ctx.fillStyle='rgba(3,4,10,.42)'; ctx.fillRect(0,0,w,h); ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font=`${Math.max(17,Math.round(h*.029))}px system-ui`; ctx.fillText('全身が入る位置に立つと追従します',w/2,h/2); ctx.restore();
}

function setCameraForViewport(vp){
  activeViewport = vp;
  const aspect = Math.max(.1, vp.w/vp.h);
  viewHeight = 6; viewWidth = viewHeight * aspect;
  camera.left = -viewWidth/2; camera.right = viewWidth/2; camera.top = viewHeight/2; camera.bottom = -viewHeight/2; camera.updateProjectionMatrix();
}
function clearWebGL(){ renderer.setScissorTest(false); renderer.setViewport(0,0,glCanvas.width,glCanvas.height); renderer.clear(true,true,true); }
function renderAvatarViewport(vp,lm){
  setCameraForViewport(vp);
  updateVRMAvatar(lm);
  renderer.setScissorTest(true);
  renderer.setViewport(vp.x, glCanvas.height - vp.y - vp.h, vp.w, vp.h);
  renderer.setScissor(vp.x, glCanvas.height - vp.y - vp.h, vp.w, vp.h);
  renderer.render(scene,camera); renderer.setScissorTest(false);
}
function drawFrame(lm){
  const w = videoCanvas.width, h = videoCanvas.height;
  vctx.clearRect(0,0,w,h); lctx.clearRect(0,0,w,h); clearWebGL();
  if(mode === 'avatar'){
    const full = {x:0,y:0,w,h};
    if(bgToggle.checked && started) drawMirroredVideo(full,'cover',.92); else drawFantasyBackground(vctx,w,h);
    renderAvatarViewport(full,lm || null);
    if(lm && debugToggle.checked) drawSkeleton(lctx,lm,full,{lineWidth:Math.max(2,w*.004),radius:Math.max(4,w*.005)});
    if(!lm && started) drawNoPose(lctx,w,h);
    if(!started){
      lctx.save(); lctx.textAlign='center'; lctx.fillStyle='rgba(255,255,255,.72)'; lctx.font=`${Math.max(12,Math.round(h*.020))}px system-ui`; lctx.fillText('内蔵VRMプレビュー。開始後、姿勢に合わせて動きます',w/2,h-34); lctx.restore();
    }
  }else{
    drawFantasyBackground(vctx,w,h);
    const gap = Math.max(18,w*.025), margin = Math.max(12,w*.018);
    const panelW = (w - margin*2 - gap)/2; const panelH = h - margin*2;
    const left = {x:margin,y:margin,w:panelW,h:panelH}; const right = {x:margin+panelW+gap,y:margin,w:panelW,h:panelH};
    drawPanel(vctx,left,'REAL'); drawPanel(vctx,right,'VRM AVATAR');
    if(started){ vctx.save(); vctx.beginPath(); vctx.roundRect(left.x,left.y,left.w,left.h,24); vctx.clip(); drawMirroredVideo(left,'contain',.95); vctx.restore(); }
    renderAvatarViewport(right,lm || null);
    if(lm){
      drawSkeleton(lctx,lm,left,{lineWidth:Math.max(2,w*.003),radius:Math.max(3,w*.004),pad:Math.min(left.w,left.h)*.02});
      drawLinks(lctx,lm,left,right);
      if(debugToggle.checked) drawSkeleton(lctx,lm,right,{lineWidth:Math.max(2,w*.0024),radius:Math.max(3,w*.0035),pad:Math.min(right.w,right.h)*.02,stroke:'rgba(216,196,154,.7)'});
    }else if(started){ drawNoPose(lctx,w,h); }
  }
}

function renderLoop(){
  fitCanvases();
  if(video.readyState >= 2 && poseLandmarker && video.currentTime !== lastVideoTime){
    try{
      lastResult = poseLandmarker.detectForVideo.length >= 2 ? poseLandmarker.detectForVideo(video, performance.now()) : poseLandmarker.detectForVideo(video);
      lastVideoTime = video.currentTime;
    }catch(e){ console.error(e); }
  }
  const raw = lastResult?.landmarks?.[0] || null;
  const lm = raw ? smoothLandmarks(raw) : null;
  const score = trackingScore(lm);
  trackingMeter.style.width = `${Math.round(score*100)}%`;
  subStatus.textContent = score > .55 ? `追従中 / ${currentModelMeta?.label || '未読込'}` : (started ? `検出待ち / ${currentModelMeta?.label || '未読込'}` : '未起動');
  drawFrame(lm);
  const now = performance.now(); fps = fps*.88 + (1000/Math.max(1,now-lastFrameTs))*.12; lastFrameTs = now; fpsEl.textContent = Math.round(fps);
  rafId = requestAnimationFrame(renderLoop);
}

function initialPaint(){
  fitCanvases(); initThree(); drawFantasyBackground(vctx,videoCanvas.width,videoCanvas.height);
  lctx.save(); lctx.textAlign='center'; lctx.fillStyle='rgba(255,255,255,.92)'; lctx.font=`${Math.max(19,Math.round(videoCanvas.height*.032))}px system-ui`; lctx.fillText('開始を押す',videoCanvas.width/2,videoCanvas.height/2-14); lctx.font=`${Math.max(12,Math.round(videoCanvas.height*.020))}px system-ui`; lctx.fillStyle='rgba(255,255,255,.64)'; lctx.fillText('サイズ固定補正済み。内蔵VRMを大きめに表示してから体の動きに合わせます',videoCanvas.width/2,videoCanvas.height/2+24); lctx.restore();
}
initialPaint();
loadBuiltInVRM();

window.addEventListener('beforeunload',()=>{
  cancelAnimationFrame(rafId);
  const stream = video.srcObject;
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
